[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["venv", ".venv", "models", "learning"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E402", "E501", "B905"]  # E402: scripts adjust sys.path first; E501: formatter-owned
